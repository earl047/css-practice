<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="business-card">
        <img class="profile" src="dog.jpg" alt="Profile Picture">
        <p class="name">EARL</p>
        <p class="designation">Software Developer</p>
        <p class="company">Sample Company</p>
        <hr>
        <p class="email">earl@gmail.com</p>
        <p class="phone">123456789</p>
        <a class="portfolio" href="https://github.com/earl047">Portfolio</a>
        <hr>
        <div class="socail-media">
            <a class="github" href="https://github.com/earl047">Github</a>
        </div>
    </div>
</body>
</html>
